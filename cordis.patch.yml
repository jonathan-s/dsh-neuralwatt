# Bundle layer contributed by dsh-neuralwatt-provider.
# Inserts the Neuralwatt route next to the shipped adapters. Edit the profile's
# own cordis.patch.yml to override any field below; a bundle layer is the
# package default, not the user's document. Every field is a live reference: an
# edit reaches the next request without a restart, and only the display name or
# retry policy re-registers the route.
- insert:
    - id: llm-neuralwatt
      name: 'dsh-neuralwatt-provider'
      config:
        baseURL: https://api.neuralwatt.com/v1
        apiKeyEnv: NEURALWATT_API_KEY
        displayName: Neuralwatt
